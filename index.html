<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cican Geometric Consciousness Model™: Lord's Prayer Algorithm</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#container{position:fixed;inset:0;width:100%;height:100%;background:#000}
#background-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.7);z-index:0;display:none}
canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important;display:block;z-index:1}
#info{position:fixed;top:15px;left:0;width:100%;padding:0 14px;text-align:center;color:#FFD700;font-family:monospace;font-size:16px;line-height:1.5;text-shadow:0 0 5px #000;z-index:5;pointer-events:none}
#info span{font-size:1.2em;color:#AAEEFF;text-shadow:0 0 8px #AAEEFF}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:monospace;font-size:13px;z-index:20;text-align:center;padding:20px}
@media(max-width:600px){#info{font-size:11px;top:9px}#info span{font-size:12px}}
</style>
</head>
<body>
<div id="container">
<img id="background-image" src="6B82BA3D-7B31-41D5-A35F-B3B40D5C052F.jpeg" alt="">
</div>
<div id="loading">INITIALIZING CICAN GEOMETRIC CONSCIOUSNESS MODEL™...</div>
<div id="info">
<span>Cican George Alin Geometric Consciousness Model™</span><br>
Axiom: PG ≡ (T<sub>L</sub> ∩ T<sub>R</sub>) ⊆ C
<br><small>(Drag to interact · Scroll to zoom)</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";

function start(){
 if(typeof THREE==="undefined"){
   document.getElementById("loading").textContent="Three.js could not be loaded. Please check the connection and reload.";
   return;
 }

 const container=document.getElementById("container");
 const loading=document.getElementById("loading");
 const bg=document.getElementById("background-image");

 bg.addEventListener("load",function(){bg.style.display="block"});
 bg.addEventListener("error",function(){bg.style.display="none"});

 const scene=new THREE.Scene();
 const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
 camera.position.set(0,0,6);

 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.setClearColor(0x000000,0);
 container.appendChild(renderer.domElement);

 const controls=THREE.OrbitControls ? new THREE.OrbitControls(camera,renderer.domElement) : null;
 if(controls){
   controls.enableDamping=true;
   controls.dampingFactor=.05;
   controls.enablePan=false;
   controls.minDistance=3;
   controls.maxDistance=12;
 }

 const size=2;

 const cube=new THREE.Mesh(
   new THREE.BoxGeometry(size,size,size),
   new THREE.MeshBasicMaterial({color:0x0055AA,wireframe:true,transparent:true,opacity:.25})
 );
 scene.add(cube);

 const tetraGeometry=new THREE.TetrahedronGeometry(size*1.2,0);

 const tetraL=new THREE.Mesh(
   tetraGeometry,
   new THREE.MeshBasicMaterial({color:0xFF2222,wireframe:true,transparent:true,opacity:.55})
 );
 scene.add(tetraL);

 const tetraR=new THREE.Mesh(
   tetraGeometry.clone(),
   new THREE.MeshBasicMaterial({color:0x22FF66,wireframe:true,transparent:true,opacity:.55})
 );
 tetraR.rotation.x=Math.PI/2;
 tetraR.rotation.y=Math.PI/4;
 scene.add(tetraR);

 const octaPG=new THREE.Mesh(
   new THREE.OctahedronGeometry(size/2,0),
   new THREE.MeshBasicMaterial({color:0xFFD700})
 );
 scene.add(octaPG);

 const glow=new THREE.Mesh(
   new THREE.SphereGeometry(.65,24,24),
   new THREE.MeshBasicMaterial({color:0xFFD700,transparent:true,opacity:.08})
 );
 scene.add(glow);

 addEventListener("resize",function(){
   camera.aspect=innerWidth/innerHeight;
   camera.updateProjectionMatrix();
   renderer.setSize(innerWidth,innerHeight);
 });

 loading.style.opacity="0";
 setTimeout(function(){loading.style.display="none"},500);

 function animate(){
   requestAnimationFrame(animate);
   if(controls) controls.update();

   const speed=.005;
   cube.rotation.x+=speed*.2;
   cube.rotation.y+=speed*.2;
   tetraL.rotation.x+=speed*.8;
   tetraL.rotation.y+=speed*.8;
   tetraR.rotation.x-=speed*.8;
   tetraR.rotation.y-=speed*.8;
   octaPG.rotation.x+=speed*1.5;
   octaPG.rotation.y+=speed*1.5;

   renderer.render(scene,camera);
 }
 animate();
}

try{start()}catch(e){
 console.error(e);
 document.getElementById("loading").textContent="The model could not initialize. Please reload the page.";
}
})();
</script>
</body>
</html>
