<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CICAN — Geometric Consciousness Model™ V2</title>
<meta name="description" content="CICAN Geometric Consciousness Model V2 — an interactive geometric laboratory for the Lord's Prayer Algorithm.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
#app{position:fixed;inset:0}.hud{position:fixed;z-index:5;pointer-events:none}
#top{top:18px;left:20px}.brand{font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.sub{margin-top:5px;font-size:11px;letter-spacing:.08em;opacity:.65}
#axiom{top:18px;right:20px;text-align:right;font-family:ui-monospace,monospace;font-size:14px}.status{margin-top:7px;font-size:10px;opacity:.65}
#panel{left:20px;bottom:20px;width:min(360px,calc(100vw - 40px));background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);padding:14px;pointer-events:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.btn{border:1px solid rgba(255,255,255,.25);background:#090909;color:#fff;padding:8px 10px;font-size:11px;cursor:pointer}.btn:hover{border-color:#fff}.btn.active{background:#fff;color:#000}
.metric{font-family:ui-monospace,monospace;font-size:10px;line-height:1.7;opacity:.9}.ok{color:#9f9}.pending{color:#fc6}
#legend{right:20px;bottom:20px;font-size:10px;line-height:1.8;text-align:right;opacity:.72}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:20;font-family:ui-monospace,monospace;font-size:12px}
@media(max-width:700px){#top{top:10px;left:12px}.brand{font-size:11px}#axiom{top:10px;right:12px;font-size:10px}#panel{left:10px;bottom:10px;width:calc(100vw - 20px)}#legend{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">INITIALIZING V2 GEOMETRIC LABORATORY…</div>
<div id="top" class="hud"><div class="brand">CICAN GEOMETRIC CONSCIOUSNESS MODEL™</div><div class="sub">V2 · GEOMETRIC LABORATORY</div></div>
<div id="axiom" class="hud">PG ≡ (T<sub>L</sub> ∩ T<sub>R</sub>) ⊆ C<div class="status">AXIOM STATUS: <span id="axiomStatus" class="pending">UNDER INVESTIGATION</span></div></div>
<div id="panel" class="hud">
  <div class="row">
    <button class="btn active" id="rotate">AUTO ROTATE</button>
    <button class="btn active" id="wire">WIREFRAME</button>
    <button class="btn" id="reset">RESET VIEW</button>
  </div>
  <div class="metric" id="metrics"></div>
</div>
<div id="legend" class="hud">
C · containment frame<br>
T<sub>L</sub> · tetrahedron L<br>
T<sub>R</sub> · tetrahedron R<br>
PG · central octahedral object
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{"use strict";
const loading=document.getElementById("loading"), metrics=document.getElementById("metrics"), status=document.getElementById("axiomStatus");
if(!window.THREE){loading.textContent="Three.js failed to load.";return}
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);
camera.position.set(4.8,3.6,6.2);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x000000,1);
document.getElementById("app").appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.06; controls.enablePan=false; controls.minDistance=3; controls.maxDistance=14;

const root=new THREE.Group(); scene.add(root);
const C=2, T=2.4;
const cube=new THREE.Mesh(new THREE.BoxGeometry(C,C,C),new THREE.MeshBasicMaterial({color:0x2377ff,wireframe:true,transparent:true,opacity:.32}));
root.add(cube);

const tl=new THREE.Mesh(new THREE.TetrahedronGeometry(T,0),new THREE.MeshBasicMaterial({color:0xff3030,wireframe:true,transparent:true,opacity:.75}));
root.add(tl);
const tr=new THREE.Mesh(new THREE.TetrahedronGeometry(T,0),new THREE.MeshBasicMaterial({color:0x31ff78,wireframe:true,transparent:true,opacity:.75}));
tr.rotation.set(Math.PI/2,Math.PI/4,0); root.add(tr);

const pg=new THREE.Mesh(new THREE.OctahedronGeometry(.72,0),new THREE.MeshBasicMaterial({color:0xffd21a,wireframe:true,transparent:true,opacity:.95}));
root.add(pg);
const core=new THREE.Mesh(new THREE.SphereGeometry(.18,20,20),new THREE.MeshBasicMaterial({color:0xffffff}));
root.add(core);

function insideCube(p){return Math.abs(p.x)<=C/2+1e-8&&Math.abs(p.y)<=C/2+1e-8&&Math.abs(p.z)<=C/2+1e-8}
function tetraVertices(mesh){
 const a=[]; mesh.geometry.attributes.position; const pos=mesh.geometry.attributes.position;
 for(let i=0;i<pos.count;i++){const p=new THREE.Vector3().fromBufferAttribute(pos,i).applyMatrix4(mesh.matrixWorld); if(!a.some(q=>q.distanceToSquared(p)<1e-10))a.push(p)}
 return a;
}
function report(){
 root.updateMatrixWorld(true);
 const pv=tetraVertices(pg), cubeOK=pv.every(insideCube);
 // Both tetrahedra are centered at the origin; the origin is therefore inside both.
 const origin=new THREE.Vector3(0,0,0);
 const sharedCenter=true;
 metrics.innerHTML=
  '<b>COMPUTATIONAL CHECKS</b><br>'+
  'PG vertices inside C: <span class="'+(cubeOK?'ok':'pending')+'">'+(cubeOK?'PASS':'FAIL')+'</span><br>'+
  'T<sub>L</sub> ∩ T<sub>R</sub> non-empty: <span class="ok">PASS</span> (shared center)<br>'+
  'PG ≡ T<sub>L</sub> ∩ T<sub>R</sub>: <span class="pending">NOT PROVEN</span><br>'+
  'Containment relation PG ⊆ C: <span class="'+(cubeOK?'ok':'pending')+'">'+(cubeOK?'PASS':'FAIL')+'</span>';
 status.textContent=cubeOK?'PARTIALLY VERIFIED':'REQUIRES REVISION';
 status.className=cubeOK?'ok':'pending';
}
let auto=true, wire=true;
document.getElementById("rotate").onclick=()=>{auto=!auto;event.currentTarget.classList.toggle("active",auto)};
document.getElementById("wire").onclick=()=>{wire=!wire;[cube,tl,tr,pg].forEach(m=>m.material.wireframe=wire);event.currentTarget.classList.toggle("active",wire)};
document.getElementById("reset").onclick=()=>{camera.position.set(4.8,3.6,6.2);controls.target.set(0,0,0);controls.update();root.rotation.set(0,0,0)};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
loading.style.display="none"; report();
function animate(){requestAnimationFrame(animate);if(auto){root.rotation.y+=.0025;root.rotation.x+=.0007}controls.update();renderer.render(scene,camera)}animate();
})();
</script>
</body>
</html>
