<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CICAN — Geometric Consciousness Model™ V2</title>
<meta name="description" content="CICAN Geometric Consciousness Model V2 — an interactive geometric laboratory for the Lord's Prayer Algorithm.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
#app{position:fixed;inset:0}.hud{position:fixed;z-index:5;pointer-events:none}
#top{top:18px;left:20px}.brand{font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.sub{margin-top:5px;font-size:11px;letter-spacing:.08em;opacity:.65}
#axiom{top:18px;right:20px;text-align:right;font-family:ui-monospace,monospace;font-size:14px}.status{margin-top:7px;font-size:10px;opacity:.65}
#panel{left:20px;bottom:20px;width:min(360px,calc(100vw - 40px));background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);padding:14px;pointer-events:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.btn{border:1px solid rgba(255,255,255,.25);background:#090909;color:#fff;padding:8px 10px;font-size:11px;cursor:pointer}.btn:hover{border-color:#fff}.btn.active{background:#fff;color:#000}
.metric{font-family:ui-monospace,monospace;font-size:10px;line-height:1.7;opacity:.9}.ok{color:#9f9}.pending{color:#fc6}
#legend{right:20px;bottom:20px;font-size:10px;line-height:1.8;text-align:right;opacity:.72}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:20;font-family:ui-monospace,monospace;font-size:12px}
@media(max-width:700px){#top{top:10px;left:12px}.brand{font-size:11px}#axiom{top:10px;right:12px;font-size:10px}#panel{left:10px;bottom:10px;width:calc(100vw - 20px)}#legend{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">INITIALIZING V2 GEOMETRIC LABORATORY…</div>
<div id="top" class="hud"><div class="brand">CICAN GEOMETRIC CONSCIOUSNESS MODEL™</div><div class="sub">V2 · GEOMETRIC LABORATORY</div></div>
<div id="axiom" class="hud">PG ≡ (T<sub>L</sub> ∩ T<sub>R</sub>) ⊆ C<div class="status">AXIOM STATUS: <span id="axiomStatus" class="pending">UNDER INVESTIGATION</span></div></div>
<div id="panel" class="hud">
  <div class="row">
    <button class="btn active" id="rotate">AUTO ROTATE</button>
    <button class="btn active" id="wire">WIREFRAME</button>
    <button class="btn" id="reset">RESET VIEW</button>
  </div>
  <div class="metric" id="metrics"></div>
</div>
<div id="legend" class="hud">
C · containment frame<br>
T<sub>L</sub> · tetrahedron L<br>
T<sub>R</sub> · tetrahedron R<br>
PG · central octahedral object
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{"use strict";
const loading=document.getElementById("loading"), metrics=document.getElementById("metrics"), status=document.getElementById("axiomStatus");
if(!window.THREE){loading.textContent="Three.js failed to load.";return}
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);
camera.position.set(4.8,3.6,6.2);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x000000,1);
document.getElementById("app").appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.06; controls.enablePan=false; controls.minDistance=3; controls.maxDistance=14;

const root=new THREE.Group(); scene.add(root);
// V2 canonical coordinate model.
// Every visible object is generated from these definitions.
const MODEL={
 cubeHalf:1,
 tetraEdge:2.4,
 tetraLRotation:new THREE.Euler(0,0,0),
 tetraRRotation:new THREE.Euler(Math.PI/2,Math.PI/4,0),
 pgRadius:.72
};
const C=2, T=MODEL.tetraEdge;
const cube=new THREE.Mesh(new THREE.BoxGeometry(C,C,C),new THREE.MeshBasicMaterial({color:0x2377ff,wireframe:true,transparent:true,opacity:.32}));
root.add(cube);

const tl=new THREE.Mesh(new THREE.TetrahedronGeometry(T,0),new THREE.MeshBasicMaterial({color:0xff3030,wireframe:true,transparent:true,opacity:.75}));
tl.rotation.copy(MODEL.tetraLRotation); root.add(tl);
const tr=new THREE.Mesh(new THREE.TetrahedronGeometry(T,0),new THREE.MeshBasicMaterial({color:0x31ff78,wireframe:true,transparent:true,opacity:.75}));
tr.rotation.copy(MODEL.tetraRRotation); root.add(tr);

const pg=new THREE.Mesh(new THREE.OctahedronGeometry(MODEL.pgRadius,0),new THREE.MeshBasicMaterial({color:0xffd21a,wireframe:true,transparent:true,opacity:.95}));
root.add(pg);
const core=new THREE.Mesh(new THREE.SphereGeometry(.18,20,20),new THREE.MeshBasicMaterial({color:0xffffff}));
root.add(core);

const formal=document.createElement('div');
formal.id="formal";
formal.innerHTML='<b>FORMAL MODEL</b><br><br>'+
'C = { (x,y,z) ∈ ℝ³ : |x| ≤ 1, |y| ≤ 1, |z| ≤ 1 }<br><br>'+
'Tₗ = conv{v₁,v₂,v₃,v₄}<br>'+
'Tᵣ = R·Tₗ + t<br><br>'+
'PG = octahedron centered at 0<br>'+
'PG ⊆ C ⇔ every PG vertex lies in C<br><br>'+
'I = Tₗ ∩ Tᵣ<br>'+
'PG ⊆ I ⇔ every PG vertex satisfies both tetrahedral half-spaces<br><br>'+
'<span class="dim">Equality PG ≡ I requires set equality, not visual overlap.</span>';
document.body.appendChild(formal);
const formalStyle=document.createElement('style');
formalStyle.textContent='#formal{position:fixed;right:18px;bottom:58px;width:300px;max-height:44vh;overflow:auto;padding:12px 14px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.78);backdrop-filter:blur(6px);font:10px/1.6 monospace;color:#fff;z-index:5}.dim{opacity:.55}@media(max-width:600px){#formal{right:10px;width:245px;max-height:38vh;font-size:9px}}';
document.head.appendChild(formalStyle);

const testPanel=document.createElement('div');
testPanel.id="testPanel";
testPanel.innerHTML="<b>AXIOM TESTER</b><br><span id=\"testState\">READY</span>";
document.body.appendChild(testPanel);

const inspector=document.createElement('div');
inspector.id='inspector';
inspector.innerHTML='<b>GEOMETRY INSPECTOR</b><br><span class="dim">Select an object below</span>';
document.body.appendChild(inspector);

const testStyle=document.createElement('style');
testStyle.textContent='#testPanel{position:fixed;left:18px;top:58px;width:245px;padding:12px 14px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.72);backdrop-filter:blur(6px);font:11px/1.65 monospace;color:#fff;z-index:5}.testGood{color:#fff}.testBad{opacity:.6}@media(max-width:600px){#testPanel{left:10px;top:52px;width:205px;font-size:10px}}';
document.head.appendChild(testStyle);

const inspectorStyle=document.createElement('style');
inspectorStyle.textContent='#inspector{position:fixed;right:18px;top:58px;width:245px;padding:12px 14px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.72);backdrop-filter:blur(6px);font:11px/1.65 monospace;color:#fff;letter-spacing:.03em;z-index:5}.dim{opacity:.55}.inspectBtn{display:block;width:100%;margin:5px 0;padding:6px 8px;background:transparent;border:1px solid rgba(255,255,255,.16);color:#fff;text-align:left;font:10px monospace;cursor:pointer}.inspectBtn:hover,.inspectBtn.active{border-color:#fff}@media(max-width:600px){#inspector{right:10px;top:52px;width:205px;font-size:10px}}';
document.head.appendChild(inspectorStyle);

const objectDefs=[
 ['C · CUBE',cube,'Cube'],
 ['T_L · TETRAHEDRON',tl,'Tetrahedron L'],
 ['T_R · TETRAHEDRON',tr,'Tetrahedron R'],
 ['PG · OCTAHEDRON',pg,'Central PG']
];
function fmt(v){return Number(v).toFixed(4)}
function showInspector(i){
 const m=objectDefs[i][1];
 const box=new THREE.Box3().setFromObject(m), s=new THREE.Vector3();
 box.getSize(s);
 inspector.innerHTML='<b>GEOMETRY INSPECTOR</b><br><br><b>'+objectDefs[i][2]+'</b>'+
 '<br>position: ('+fmt(m.position.x)+', '+fmt(m.position.y)+', '+fmt(m.position.z)+')'+
 '<br>rotation: ('+fmt(m.rotation.x)+', '+fmt(m.rotation.y)+', '+fmt(m.rotation.z)+')'+
 '<br>world bounds: '+fmt(s.x)+' × '+fmt(s.y)+' × '+fmt(s.z)+
 '<br><br><span class="dim">Canonical V2 model</span>';
 objectDefs.forEach((d,j)=>{
  const b=document.createElement('button'); b.className='inspectBtn'+(j===i?' active':''); b.textContent=d[0];
  b.onclick=()=>showInspector(j); inspector.appendChild(b);
 });
}
objectDefs.forEach((d,i)=>{
 const b=document.createElement('button'); b.className='inspectBtn'; b.textContent=d[0];
 b.onclick=()=>showInspector(i); inspector.appendChild(b);
});

function insideCube(p){return Math.abs(p.x)<=C/2+1e-8&&Math.abs(p.y)<=C/2+1e-8&&Math.abs(p.z)<=C/2+1e-8}
function tetraVertices(mesh){
 const a=[],pos=mesh.geometry.attributes.position;
 for(let i=0;i<pos.count;i++){const p=new THREE.Vector3().fromBufferAttribute(pos,i).applyMatrix4(mesh.matrixWorld);if(!a.some(q=>q.distanceToSquared(p)<1e-10))a.push(p)}
 return a;
}
// Exact convex-polyhedron intersection for the two tetrahedra.
// Each tetrahedron is represented by four inward half-spaces.
// Candidate intersection vertices are all valid intersections of three boundary planes.
function tetraPlanes(mesh){
 const v=tetraVertices(mesh), planes=[], center=v.reduce((a,p)=>a.add(p),new THREE.Vector3()).multiplyScalar(.25);
 const faces=[[0,1,2],[0,3,1],[0,2,3],[1,3,2]];
 faces.forEach(ids=>{
   const a=v[ids[0]],b=v[ids[1]],d=v[ids[2]];
   const n=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(d,a)).normalize();
   const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(n,a);
   if(plane.distanceToPoint(center)<0) plane.negate();
   planes.push(plane);
 });
 return planes;
}
function intersectionVertices(A,B){
 const ps=A.concat(B), out=[], eps=1e-7;
 for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)for(let k=j+1;k<ps.length;k++){
   const p=new THREE.Vector3(), n1=ps[i].normal,n2=ps[j].normal,n3=ps[k].normal;
   const det=n1.dot(new THREE.Vector3().crossVectors(n2,n3));
   if(Math.abs(det)<1e-9)continue;
   // Solve n·x = -constant using Cramer's rule.
   const b1=-ps[i].constant,b2=-ps[j].constant,b3=-ps[k].constant;
   const c23=new THREE.Vector3().crossVectors(n2,n3).multiplyScalar(b1);
   const c31=new THREE.Vector3().crossVectors(n3,n1).multiplyScalar(b2);
   const c12=new THREE.Vector3().crossVectors(n1,n2).multiplyScalar(b3);
   p.copy(c23).add(c31).add(c12).divideScalar(det);
   if(ps.every(q=>q.distanceToPoint(p)>=-eps)&&!out.some(q=>q.distanceToSquared(p)<1e-10))out.push(p);
 }
 return out;
}
function insidePlanes(p,planes){return planes.every(q=>q.distanceToPoint(p)>=-1e-7)}
function hullVolume(points){
 if(points.length<4)return 0;
 let vol=0, eps=1e-8;
 const center=points.reduce((a,p)=>a.add(p.clone()),new THREE.Vector3()).multiplyScalar(1/points.length);
 for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++)for(let k=j+1;k<points.length;k++){
   const a=points[i],b=points[j],d=points[k];
   let n=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(d,a));
   if(n.lengthSq()<eps)continue;
   let pos=false,neg=false;
   for(let m=0;m<points.length;m++){if(m===i||m===j||m===k)continue;const s=n.dot(new THREE.Vector3().subVectors(points[m],a));if(s>eps)pos=true;if(s<-eps)neg=true}
   if(pos&&neg)continue;
   if(n.dot(new THREE.Vector3().subVectors(center,a))>0)n.negate();
   vol+=Math.abs(n.dot(new THREE.Vector3().subVectors(center,a)))/6;
 }
 return vol;
}
const perturb=document.createElement('div');
perturb.id="perturb";
perturb.innerHTML='<b>MODEL CONTROLS</b><br><button id="moveL">Tₗ +X</button><button id="moveR">Tᵣ −X</button><button id="twist">TWIST Tᵣ</button><button id="resetModel">RESET MODEL</button>';
document.body.appendChild(perturb);
const perturbStyle=document.createElement('style');
perturbStyle.textContent='#perturb{position:fixed;left:18px;bottom:58px;width:245px;padding:10px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.72);backdrop-filter:blur(6px);font:10px monospace;color:#fff;z-index:5}#perturb button{margin:4px 3px 0 0;padding:5px 7px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;font:9px monospace;cursor:pointer}#perturb button:hover{border-color:#fff}@media(max-width:600px){#perturb{left:10px;width:205px}}';
document.head.appendChild(perturbStyle);
const canonicalTransforms={
 L:{x:tl.position.x,y:tl.position.y,z:tl.position.z,rx:tl.rotation.x,ry:tl.rotation.y,rz:tl.rotation.z},
 R:{x:tr.position.x,y:tr.position.y,z:tr.position.z,rx:tr.rotation.x,ry:tr.rotation.y,rz:tr.rotation.z}
};
function resetModel(){
 tl.position.set(canonicalTransforms.L.x,canonicalTransforms.L.y,canonicalTransforms.L.z);
 tl.rotation.set(canonicalTransforms.L.rx,canonicalTransforms.L.ry,canonicalTransforms.L.rz);
 tr.position.set(canonicalTransforms.R.x,canonicalTransforms.R.y,canonicalTransforms.R.z);
 tr.rotation.set(canonicalTransforms.R.rx,canonicalTransforms.R.ry,canonicalTransforms.R.rz);
 evaluateAxiom();
}
document.getElementById("moveL").onclick=()=>{tl.position.x+=.15;evaluateAxiom()};
document.getElementById("moveR").onclick=()=>{tr.position.x-=.15;evaluateAxiom()};
document.getElementById("twist").onclick=()=>{tr.rotation.z+=Math.PI/12;evaluateAxiom()};
document.getElementById("resetModel").onclick=resetModel;

function pgEqualityTest(intersectionPoints){
 const pgVerts=tetraVertices(pg);
 if(intersectionPoints.length<4) return {equal:false,reason:"Intersection is not a 3D solid."};
 const planes=convexPlanesFromPoints(intersectionPoints);
 if(!planes.length) return {equal:false,reason:"Could not construct intersection boundary."};
 const pgInside=pgVerts.every(p=>insidePlanes(p,planes));
 const interInsidePG=intersectionPoints.every(p=>pointInsidePG(p));
 const iv=hullVolume(intersectionPoints);
 const pv=4*Math.pow(MODEL.pgRadius,3)/3;
 const ratio=iv>1e-10?pv/iv:0;
 const equal=pgInside&&interInsidePG&&Math.abs(ratio-1)<1e-6;
 return {equal,pgInside,interInsidePG,ratio};
}
function pointInsidePG(p){
 return Math.abs(p.x)+Math.abs(p.y)+Math.abs(p.z)<=MODEL.pgRadius+1e-8;
}
function convexPlanesFromPoints(points){
 const out=[];
 for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++)for(let k=j+1;k<points.length;k++){
  const a=points[i],b=points[j],d=points[k];
  const n=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(d,a));
  if(n.lengthSq()<1e-12)continue;
  n.normalize(); const q=-n.dot(a);
  let pos=false,neg=false;
  for(const p of points){const s=n.dot(p)+q;if(s>1e-7)pos=true;if(s<-1e-7)neg=true;}
  if(pos&&neg)continue;
  if(pos){n.negate();q=-q;}
  if(!out.some(x=>Math.abs(x.n.dot(n)-1)<1e-7&&Math.abs(x.q-q)<1e-7))out.push({n:n.clone(),q});
 }
 return out;
}

function evaluateAxiom(){
 cube.updateMatrixWorld(true); tl.updateMatrixWorld(true); tr.updateMatrixWorld(true); pg.updateMatrixWorld(true);
 const pv=tetraVertices(pg);
 const cubeOK=pv.every(insideCube);
 const planesL=tetraPlanes(tl), planesR=tetraPlanes(tr);
 const iv=intersectionVertices(planesL,planesR);
 const nonEmpty=iv.length>=4;
 const pgIn= pv.every(p=>insidePlanes(p,[...planesL,...planesR]));
 const eq=pgEqualityTest(iv);
 const state=document.getElementById("testState");
 const lines=[
  "PG ⊆ C: "+(cubeOK?"YES":"NO"),
  "Tₗ ∩ Tᵣ: "+(nonEmpty?"3D NON-EMPTY":"EMPTY / DEGENERATE"),
  "PG ⊆ (Tₗ ∩ Tᵣ): "+(pgIn?"YES":"NO"),
  "PG ≡ (Tₗ ∩ Tᵣ): "+(eq.equal?"MATCH":"NOT EQUAL / NOT PROVEN")
 ];
 state.innerHTML=lines.join("<br>")+"<br>Volume ratio PG/I: "+eq.ratio.toFixed(6);
 state.className=(cubeOK&&nonEmpty&&pgIn)?"testGood":"testBad";
}
function report(){
 root.updateMatrixWorld(true);
 const pv=tetraVertices(pg), cubeOK=pv.every(insideCube);
 const planes=tetraPlanes(tl).concat(tetraPlanes(tr));
 const iv=intersectionVertices(tetraPlanes(tl),tetraPlanes(tr));
 const nonEmpty=iv.length>0;
 const pgInIntersection=pv.every(p=>insidePlanes(p,planes));
 const intersectionVolumeCandidate=iv.length>=4;
 const intersectionVolume=hullVolume(iv);
 const pgVertsInsideIntersection=pv.filter(p=>insidePlanes(p,planes)).length;
 const pgVolume=(4*Math.pow(.72,3))/3;
 const volumeRatio=intersectionVolume>1e-10?pgVolume/intersectionVolume:0;
 const tetraEdge=T;
 const tetraVolume=tetraEdge*tetraEdge*tetraEdge/(6*Math.sqrt(2));
 const cubeVolume=C*C*C;
 const pgRadius=MODEL.pgRadius;
 const pgVol=4*pgRadius*pgRadius*pgRadius/3;
 metrics.innerHTML=
  '<b>CANONICAL MODEL</b><br>'+
  'C cube side: <span class="ok">'+C.toFixed(2)+'</span> · volume: <span class="ok">'+cubeVolume.toFixed(4)+'</span><br>'+
  'Tetrahedron edge: <span class="ok">'+tetraEdge.toFixed(2)+'</span> · volume: <span class="ok">'+tetraVolume.toFixed(4)+'</span><br>'+
  'PG octahedron radius: <span class="ok">'+pgRadius.toFixed(2)+'</span> · volume: <span class="ok">'+pgVol.toFixed(4)+'</span><br><br>'+
  '<b>COMPUTATIONAL CHECKS</b><br>'+
  'PG vertices inside C: <span class="'+(cubeOK?'ok':'pending')+'">'+(cubeOK?'PASS':'FAIL')+'</span><br>'+
  'T<sub>L</sub> ∩ T<sub>R</sub> vertices: <span class="'+(nonEmpty?'ok':'pending')+'">'+iv.length+'</span><br>'+
  'T<sub>L</sub> ∩ T<sub>R</sub> non-empty: <span class="'+(nonEmpty?'ok':'pending')+'">'+(nonEmpty?'PASS':'FAIL')+'</span><br>'+
  'PG ⊆ (T<sub>L</sub> ∩ T<sub>R</sub>): <span class="'+(pgInIntersection?'ok':'pending')+'">'+(pgInIntersection?'PASS':'FAIL')+'</span><br>'+
  'Intersection 3D candidate: <span class="'+(intersectionVolumeCandidate?'ok':'pending')+'">'+(intersectionVolumeCandidate?'YES':'NO')+'</span><br>'+
  'Tetrahedron intersection volume: <span class="ok">'+intersectionVolume.toFixed(4)+'</span><br>'+
  'PG octahedron volume: <span class="ok">'+pgVolume.toFixed(4)+'</span><br>'+
  'PG vertices inside intersection: <span class="'+(pgVertsInsideIntersection===pv.length?'ok':'pending')+'">'+pgVertsInsideIntersection+'/'+pv.length+'</span><br>'+
  'PG volume / intersection volume: <span class="pending">'+volumeRatio.toFixed(4)+'</span><br>'+
  'PG ≡ T<sub>L</sub> ∩ T<sub>R</sub>: <span class="pending">NOT PROVEN</span><br>'+
  'Containment PG ⊆ C: <span class="'+(cubeOK?'ok':'pending')+'">'+(cubeOK?'PASS':'FAIL')+'</span>';
 status.textContent=(cubeOK&&nonEmpty)?'PARTIALLY VERIFIED':'REQUIRES REVISION';
 status.className=(cubeOK&&nonEmpty)?'ok':'pending';
}
let auto=true, wire=true;
document.getElementById("rotate").onclick=()=>{auto=!auto;event.currentTarget.classList.toggle("active",auto)};
document.getElementById("wire").onclick=()=>{wire=!wire;[cube,tl,tr,pg].forEach(m=>m.material.wireframe=wire);event.currentTarget.classList.toggle("active",wire)};
document.getElementById("reset").onclick=()=>{camera.position.set(4.8,3.6,6.2);controls.target.set(0,0,0);controls.update();root.rotation.set(0,0,0)};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
loading.style.display="none"; report();\nevaluateAxiom();
function animate(){requestAnimationFrame(animate);if(auto){root.rotation.y+=.0025;root.rotation.x+=.0007}controls.update();renderer.render(scene,camera)}animate();
})();
</script>
</body>
</html>
