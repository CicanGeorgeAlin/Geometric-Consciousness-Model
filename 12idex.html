<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cican Geometric Consciousness Model™: Lord's Prayer Algorithm</title>
    
    <style>
        /* Base Styling */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000000;
        }

        /* Container for the background image and canvas */
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* The Image as the Algorithmic Background */
        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image covers the whole viewport */
            filter: brightness(0.7); /* Slightly dim the background so the geometry stands out */
            z-index: 1;
        }

        /* The Three.js Canvas Overlay */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2; /* Renders on top of the image */
        }
        
        /* Info Overlay (Model Name and Axiom) */
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #FFD700; 
            font-family: monospace;
            z-index: 3; /* Renders on top of everything */
            font-size: 16px;
            line-height: 1.5;
            text-shadow: 0 0 5px #000;
        }
        #info span {
            font-size: 1.2em; 
            color: #AAEEFF;
            text-shadow: 0 0 8px #AAEEFF;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="background-image" src="6B82BA3D-7B31-41D5-A35F-B3B40D5C052F.jpeg" alt="The Lord's Prayer Background Image">
    </div>

    <div id="info">
        <span id="model-name">Cican George Alin Geometric Consciousness Model™</span><br>
        Axiom: PG ≡ (T_L ∩ T_R) ⊆ C | (Drag to Interact)
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> 

    <script>
        // --- Core 3D Setup ---
        let scene, camera, renderer, controls;
        let cube, tetraL, tetraR, octaPG;

        function init() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer - IMPORTANT: Set alpha: true so the background image shows through
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // Make the canvas background transparent
            
            // Append the canvas to the container, not the body, for correct layering
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Orbit Controls for interaction
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 

            // --- Create Geometric Shapes (The Axiom Components) ---
            const size = 2; // Base size for the models

            // A. The Cube (C): Transparent Blue Wireframe
            const cubeGeometry = new THREE.BoxGeometry(size, size, size);
            const cubeMaterial = new THREE.MeshBasicMaterial({ color: 0x0055AA, wireframe: true, transparent: true, opacity: 0.2 });
            cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            scene.add(cube);

            // B. Interpenetrating Tetrahedra (TL and TR): Hemispheres (Red and Green Wireframes)
            const tetraGeometry = new THREE.TetrahedronGeometry(size * 1.2, 0); 
            const tetraLMaterial = new THREE.MeshBasicMaterial({ color: 0xFF0000, wireframe: true, transparent: true, opacity: 0.5 }); // Left (Red)
            const tetraRMaterial = new THREE.MeshBasicMaterial({ color: 0x00FF00, wireframe: true, transparent: true, opacity: 0.5 }); // Right (Green)

            tetraL = new THREE.Mesh(tetraGeometry, tetraLMaterial);
            tetraR = new THREE.Mesh(tetraGeometry.clone(), tetraRMaterial);
            
            tetraR.rotation.x = Math.PI / 2;
            tetraR.rotation.y = Math.PI / 4; 

            scene.add(tetraL);
            scene.add(tetraR);

            // C. The Pineal Gland (PG): Central Octahedron (Solid Gold)
            const octaGeometry = new THREE.OctahedronGeometry(size / 2);
            const octaMaterial = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: false, opacity: 1 }); 
            octaPG = new THREE.Mesh(octaGeometry, octaMaterial);
            scene.add(octaPG);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop: Axiom in Motion (Default Rotation) ---
        function animate() {
            requestAnimationFrame(animate);

            // Update controls for user interaction
            controls.update();

            // Automatic rotation (user can override by dragging)
            const speed = 0.005;
            
            cube.rotation.x += speed * 0.2;
            cube.rotation.y += speed * 0.2;

            tetraL.rotation.x += speed * 0.8;
            tetraL.rotation.y += speed * 0.8;

            tetraR.rotation.x -= speed * 0.8; 
            tetraR.rotation.y -= speed * 0.8;

            octaPG.rotation.x += speed * 1.5; 
            octaPG.rotation.y += speed * 1.5;
            
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
